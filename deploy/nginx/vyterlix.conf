# nginx for vyterlix.com: serves the website files and sends /api/ to the app on localhost.
# Install: sudo cp vyterlix.conf /etc/nginx/sites-available/vyterlix && sudo ln -s ../sites-available/vyterlix /etc/nginx/sites-enabled/
# Then:    sudo certbot --nginx -d vyterlix.com -d www.vyterlix.com   (adds HTTPS and the redirect)

limit_req_zone $binary_remote_addr zone=vyterlix_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=vyterlix_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name vyterlix.com www.vyterlix.com;

    root /srv/vyterlix/frontend;
    index index.html;

    client_max_body_size 12m;   # uploads (the app's own limit is checked too)

    # Security headers. The pages use style attributes, so inline styles are allowed; scripts are not.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # The website: no build step, so ask the browser to check for a newer copy every time. It only
    # downloads again when the file changed (ETag), so a deploy is never hidden behind a stale copy.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
    location /img/ {
        add_header Cache-Control "public, max-age=604800" always;
    }

    # Sign-in and password pages get a tighter rate limit on top of the app's own lock-out.
    location ~ ^/api/v1/auth/(login|forgot-password|reset-password|register)$ {
        limit_req zone=vyterlix_login burst=5 nodelay;
        include /etc/nginx/vyterlix-proxy.conf;
    }

    location /api/ {
        limit_req zone=vyterlix_api burst=40 nodelay;
        include /etc/nginx/vyterlix-proxy.conf;
    }

    # Never serve the code, config or hidden files by accident.
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(py|md|bat|ini|env)$ { deny all; }
    location /tools/ { deny all; }
}

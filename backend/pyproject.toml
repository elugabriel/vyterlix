[project]
name = "vyterlix-backend"
version = "0.1.0"
description = "Vyterlix API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "email-validator>=2.1",
    "pyjwt>=2.9",
    "tzdata>=2024.1",  # Europe/London rules on Windows, which has no system tz database
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Generated migrations: always import op/sa even when unused, and have long lines.
"alembic/versions/*" = ["F401", "E501"]

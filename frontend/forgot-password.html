<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Forgot password · Vyterlix</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="theme-color" content="#1f6b4a">
  <link rel="stylesheet" href="css/base.css">
  <script src="js/formguard.js"></script>
  <script src="js/config.js"></script>
  <script type="module" src="js/pages/forgot-password.js"></script>
  <!-- preload:start (written by frontend/tools/preload_hints.py; do not edit by hand) -->
  <link rel="modulepreload" href="js/auth.js">
  <link rel="modulepreload" href="js/ui.js">
  <link rel="modulepreload" href="js/api.js">
  <link rel="modulepreload" href="js/dom.js">
  <!-- preload:end -->
</head>
<body>
  <main class="auth-page">
    <section class="card auth-card">
      <h1>Reset your password</h1>
      <div id="message" class="message" role="alert" hidden></div>
      <p class="muted">Enter your email and we'll send you a link to choose a new password.</p>
      <form id="form" method="post" data-guard novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <button type="submit" class="full">Send reset link</button>
      </form>
      <div class="auth-links"><a href="login.html">Back to log in</a></div>
    </section>
  </main>
</body>
</html>

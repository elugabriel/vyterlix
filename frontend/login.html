<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Log in · Vyterlix</title>
  <link rel="stylesheet" href="css/base.css">
  <script src="js/config.js"></script>
  <script type="module" src="js/pages/login.js"></script>
</head>
<body>
  <main class="auth-page">
    <section class="card auth-card">
      <h1>Log in to Vyterlix</h1>
      <div id="message" class="message" role="alert" hidden></div>
      <form id="form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="full">Log in</button>
      </form>
      <div class="auth-links">
        <a href="forgot-password.html">Forgot your password?</a>
        <a id="register-link" href="register.html">Create an account</a>
      </div>
    </section>
  </main>
</body>
</html>

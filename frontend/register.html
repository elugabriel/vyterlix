<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Create account · Vyterlix</title>
  <link rel="stylesheet" href="css/base.css">
  <script src="js/config.js"></script>
  <script type="module" src="js/pages/register.js"></script>
</head>
<body>
  <main class="auth-page">
    <section class="card auth-card">
      <h1>Create your account</h1>
      <div id="message" class="message" role="alert" hidden></div>
      <form id="form" novalidate>
        <div class="field">
          <label for="full_name">Your name</label>
          <input id="full_name" name="full_name" type="text" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" required>
          <p class="hint">At least 12 characters. A few random words works well.</p>
        </div>
        <button type="submit" class="full">Create account</button>
      </form>
      <div class="auth-links">
        <a id="login-link" href="login.html">Already have an account? Log in</a>
      </div>
    </section>
  </main>
</body>
</html>

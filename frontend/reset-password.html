<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Choose a new password · Vyterlix</title>
  <link rel="stylesheet" href="css/base.css">
  <script src="js/config.js"></script>
  <script type="module" src="js/pages/reset-password.js"></script>
</head>
<body>
  <main class="auth-page">
    <section class="card auth-card">
      <h1>Choose a new password</h1>
      <div id="message" class="message" role="alert" hidden></div>
      <form id="form" novalidate>
        <div class="field">
          <label for="new_password">New password</label>
          <input id="new_password" name="new_password" type="password" autocomplete="new-password" required>
          <p class="hint">At least 12 characters. A few random words works well.</p>
        </div>
        <div class="field">
          <label for="confirm">Confirm new password</label>
          <input id="confirm" name="confirm" type="password" autocomplete="new-password" required>
        </div>
        <button type="submit" class="full">Set new password</button>
      </form>
      <div class="auth-links">
        <a href="forgot-password.html">Need a new link?</a>
        <a href="login.html">Back to log in</a>
      </div>
    </section>
  </main>
</body>
</html>
